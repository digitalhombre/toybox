<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .upload-section {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .upload-section h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2rem;
        }

        .file-input-wrapper {
            margin: 20px 0;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            padding: 12px 30px;
            background: #667eea;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.3s ease;
            font-size: 1rem;
        }

        .file-label:hover {
            background: #5568d3;
        }

        .viewer-section {
            display: none;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .viewer-section.active {
            display: block;
        }

        .turn-display {
            margin-bottom: 30px;
            min-height: 300px;
        }

        .speaker-message {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 8px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .speaker-message:first-child {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
        }

        .speaker-message:last-child {
            background: #fff4f0;
            border-left: 4px solid #764ba2;
        }

        .speaker-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 1.1rem;
        }

        .speaker-text {
            color: #555;
            line-height: 1.6;
            font-size: 1rem;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #eee;
        }

        .nav-button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .nav-button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .nav-button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .turn-counter {
            font-size: 1rem;
            color: #666;
            font-weight: 500;
        }

        .back-button {
            margin-bottom: 20px;
            padding: 10px 20px;
            background: #764ba2;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .back-button:hover {
            background: #653a8a;
        }

        .file-name {
            margin-top: 15px;
            color: #666;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="upload-section" id="uploadSection">
            <h1>Conversation Viewer</h1>
            <p style="color: #666; margin-bottom: 20px;">Upload a conversation text file to begin</p>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".txt">
                <label for="fileInput" class="file-label">Choose File</label>
            </div>
            <div class="file-name" id="fileName"></div>
        </div>

        <div class="viewer-section" id="viewerSection">
            <button class="back-button" id="backButton">← Back to Upload</button>
            <div class="turn-display" id="turnDisplay"></div>
            <div class="navigation">
                <button class="nav-button" id="prevButton">← Previous</button>
                <div class="turn-counter" id="turnCounter"></div>
                <button class="nav-button" id="nextButton">Next →</button>
            </div>
        </div>
    </div>

    <script>
        let turns = [];
        let currentTurnIndex = 0;

        const fileInput = document.getElementById('fileInput');
        const fileName = document.getElementById('fileName');
        const uploadSection = document.getElementById('uploadSection');
        const viewerSection = document.getElementById('viewerSection');
        const turnDisplay = document.getElementById('turnDisplay');
        const turnCounter = document.getElementById('turnCounter');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const backButton = document.getElementById('backButton');

        fileInput.addEventListener('change', handleFileUpload);
        prevButton.addEventListener('click', showPreviousTurn);
        nextButton.addEventListener('click', showNextTurn);
        backButton.addEventListener('click', backToUpload);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (viewerSection.classList.contains('active')) {
                if (e.key === 'ArrowLeft') {
                    showPreviousTurn();
                } else if (e.key === 'ArrowRight') {
                    showNextTurn();
                }
            }
        });

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            fileName.textContent = `Selected: ${file.name}`;

            const reader = new FileReader();
            reader.onload = (e) => {
                const content = e.target.result;
                parseConversation(content);
                if (turns.length > 0) {
                    showViewer();
                    currentTurnIndex = 0;
                    displayTurn();
                } else {
                    alert('No valid conversation turns found in the file.');
                }
            };
            reader.readAsText(file);
        }

        function parseConversation(text) {
            turns = [];

            // Normalize line endings (handle \r\n, \r, and \n)
            text = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');

            const lines = text.split('\n');
            const speakers = [];

            let currentSpeaker = null;
            let currentMessage = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                // Match "name said:" with optional text after
                const match = line.match(/^(.+?)\s+said:\s*(.*)$/);

                if (match) {
                    // Save previous speaker if exists
                    if (currentSpeaker !== null) {
                        const messageText = currentMessage.join('\n').trim();
                        if (messageText) {
                            speakers.push({
                                name: currentSpeaker,
                                text: messageText
                            });
                        }
                    }

                    // Start new speaker
                    currentSpeaker = match[1].trim();
                    currentMessage = [];

                    // If there's text after "said:" on the same line, include it
                    const afterSaid = match[2].trim();
                    if (afterSaid) {
                        currentMessage.push(afterSaid);
                    }
                } else if (currentSpeaker !== null) {
                    // Add line to current speaker's message
                    currentMessage.push(line);
                }
            }

            // Save last speaker
            if (currentSpeaker !== null) {
                const messageText = currentMessage.join('\n').trim();
                if (messageText) {
                    speakers.push({
                        name: currentSpeaker,
                        text: messageText
                    });
                }
            }

            // Group speakers into turns (pairs)
            for (let i = 0; i < speakers.length - 1; i += 2) {
                turns.push({
                    speaker1: speakers[i],
                    speaker2: speakers[i + 1]
                });
            }
        }

        function displayTurn() {
            if (turns.length === 0) return;

            const turn = turns[currentTurnIndex];

            // Helper function to escape HTML and preserve newlines
            function formatText(text) {
                return text
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;')
                    .replace(/\n/g, '<br>');
            }

            turnDisplay.innerHTML = `
                <div class="speaker-message">
                    <div class="speaker-name">${turn.speaker1.name}</div>
                    <div class="speaker-text">${formatText(turn.speaker1.text)}</div>
                </div>
                <div class="speaker-message">
                    <div class="speaker-name">${turn.speaker2.name}</div>
                    <div class="speaker-text">${formatText(turn.speaker2.text)}</div>
                </div>
            `;

            turnCounter.textContent = `Turn ${currentTurnIndex + 1} of ${turns.length}`;

            prevButton.disabled = currentTurnIndex === 0;
            nextButton.disabled = currentTurnIndex === turns.length - 1;
        }

        function showPreviousTurn() {
            if (currentTurnIndex > 0) {
                currentTurnIndex--;
                displayTurn();
            }
        }

        function showNextTurn() {
            if (currentTurnIndex < turns.length - 1) {
                currentTurnIndex++;
                displayTurn();
            }
        }

        function showViewer() {
            uploadSection.style.display = 'none';
            viewerSection.classList.add('active');
        }

        function backToUpload() {
            viewerSection.classList.remove('active');
            uploadSection.style.display = 'block';
            turns = [];
            currentTurnIndex = 0;
            fileInput.value = '';
            fileName.textContent = '';
        }
    </script>
</body>
</html>
